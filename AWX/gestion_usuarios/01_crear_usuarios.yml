---
# =============================================================================
# OPCIÓN 1 - CREAR USUARIOS (con contraseña o con llave SSH)
#
# AWX: plantilla "USUARIOS | 1 - Crear usuarios" con la encuesta
#      awx/encuestas/01_crear_usuarios.json
#
# Orden: validar encuesta -> verificar servidores (solo lectura) -> llaves ->
# crear cuentas. Si una validación falla no se modifica nada.
#
# LLAVES (método llave, origen keys): viven en /data/work/gestion_usuarios/keys.
# Si el usuario ya tiene llave se REUTILIZA en cualquier servidor. Solo se genera
# una nueva si no tiene, o si se marca la opción crítica crear_renovar_llave=SI.
# =============================================================================

- name: "Opción 1 | Validar encuesta y preparar usuarios"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Validar y normalizar
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: preparar.yml

- name: "Opción 1 | Verificar servidores (solo lectura)"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Verificar
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: verificar.yml

- name: "Opción 1 | Reutilizar o generar llaves"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Llaves
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: llaves.yml

- name: "Opción 1 | Crear usuarios en los servidores"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  roles:
    - usuarios_crear

---
# =============================================================================
# OPCIÓN 1 - CREAR USUARIOS (con contraseña o con llave SSH)
#
# AWX: dos plantillas usan este playbook; cada una fija el método en sus variables:
#   "USUARIOS | 1a - Crear con contraseña"  crear_metodo_acceso=contrasena  (awx/encuestas/01a_crear_con_contrasena.json)
#   "USUARIOS | 1b - Crear con llave"       crear_metodo_acceso=llave       (awx/encuestas/01b_crear_con_llave.json)
#
# Orden: validar encuesta -> verificar servidores (solo lectura) -> llaves ->
# crear cuentas. Si una validación falla no se modifica nada.
#
# LLAVES (método llave): viven en /data/work/gestion_usuarios/keys.
# Si el usuario ya tiene llave se REUTILIZA en cualquier servidor. Solo se genera
# una nueva si no tiene, o si se marca la opción crítica crear_renovar_llave=SI.
# =============================================================================

- name: "Opción 1 | Validar encuesta y preparar usuarios"
  hosts: localhost
  connection: local
  become: false   # en el contenedor no hay sudo; la plantilla activa become para todo
  gather_facts: false
  vars_files:
    - vars/comunes.yml
    - vars/perfiles.yml
  tasks:
    - name: Validar y normalizar
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: preparar.yml

- name: "Opción 1 | Verificar servidores (solo lectura)"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - vars/comunes.yml
    - vars/perfiles.yml
  tasks:
    # Lista completa: el informe incluye también los servidores que no respondan.
    - name: Registrar servidores para el informe
      ansible.builtin.set_fact:
        informe_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Verificar
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: verificar.yml

- name: "Opción 1 | Reutilizar o generar llaves"
  hosts: localhost
  connection: local
  become: false   # en el contenedor no hay sudo; la plantilla activa become para todo
  gather_facts: false
  vars_files:
    - vars/comunes.yml
    - vars/perfiles.yml
  tasks:
    - name: Llaves
      ansible.builtin.include_role:
        name: usuarios_crear
        tasks_from: llaves.yml

- name: "Opción 1 | Crear usuarios en los servidores"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: false
  vars_files:
    - vars/comunes.yml
    - vars/perfiles.yml
  roles:
    - usuarios_crear

- name: "Opción 1 | Informe del cambio"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Generar informe en Excel
      ansible.builtin.include_role:
        name: usuarios_comun
        tasks_from: informe.yml
      vars:
        informe_operacion: "{{ 'Crear usuarios con ' ~ ('llave SSH' if _crear_metodo == 'llave' else 'contraseña') }}"
        informe_prefijo: "{{ 'crear_usuarios_llave' if _crear_metodo == 'llave' else 'crear_usuarios_contrasena' }}"
        informe_solicitud: "{{ _crear_solicitud }}"
        informe_que_sigue: >-
          {{ ['Entregue a cada usuario su llave privada por un canal seguro (almacén de llaves del proyecto).']
             if _crear_metodo == 'llave' else
             ['Entregue la contraseña inicial a cada usuario por un canal seguro: en su primer ingreso deberá cambiarla.'] }}

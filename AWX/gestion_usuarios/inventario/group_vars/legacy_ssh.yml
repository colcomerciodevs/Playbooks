---
# Servidores con S.O. obsoleto (Python 2.6 / OpenSSH antiguo).
# - Conectan con ansible_test usando la llave RSA de la credencial "SSH RSA Legacy"
#   (tipo "SSH Key - Legacy RSA"), que AWX entrega en la variable legacy_ssh_key_file.
# - Las plantillas USUARIOS usan el EE "Corbeta AWX-EE-Legacy" (Ansible 2.9), el último
#   que soporta Python 2.6 en el servidor.
# - default(''): la plantilla 0 no lleva esa credencial (se conecta con usuario y clave).
ansible_user: ansible_test
ansible_ssh_private_key_file: "{{ legacy_ssh_key_file | default('') }}"
ansible_ssh_common_args: "-o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"

---
# =============================================================================
# Configuración de AWX como código. Crea o actualiza el proyecto Manual, las
# plantillas con sus encuestas y los workflows con aprobación.
#
# Requisitos: colección awx.awx y estas variables de entorno:
#   CONTROLLER_HOST, CONTROLLER_OAUTH_TOKEN, CONTROLLER_VERIFY_SSL=false
#
# Antes de ejecutarlo el proyecto debe estar copiado en
# /var/lib/awx/projects/<awx_ruta_local> del servidor de AWX.
#
#   ansible-playbook awx/configurar_awx.yml -e awx_ruta_local=gestion_usuarios
# =============================================================================

- name: Configurar AWX para gestion_usuarios
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_organizacion: Corbeta-Infra
    awx_proyecto: Gestion de usuarios Linux
    awx_ruta_local: ""                   # obligatorio
    awx_inventario: Inventario 2026 - Gestion Usuarios
    awx_credencial_maquina: SSH Private Key - ECDSA
    awx_ee: Corbeta AWX-EE
    awx_grupo_persistente: Container_Group_Corbeta
    awx_aprobacion_timeout: 14400        # segundos (4 horas) para aprobar antes de que expire
    awx_plantillas:
      - nombre: "USUARIOS | 1 - Crear usuarios"
        playbook: 01_crear_usuarios.yml
        encuesta: 01_crear_usuarios.json
        persistente: true                # guarda llaves
      - nombre: "USUARIOS | 2 - Cambiar contraseña"
        playbook: 02_cambiar_contrasena.yml
        encuesta: 02_cambiar_contrasena.json
      - nombre: "USUARIOS | 3 - Auditoría"
        playbook: 03_auditoria_usuarios.yml
        encuesta: 03_auditoria_usuarios.json
        persistente: true                # guarda reportes
      - nombre: "USUARIOS | 4 - Bloquear o eliminar"
        playbook: 04_bloquear_eliminar_usuarios.yml
        encuesta: 04_bloquear_eliminar_usuarios.json
    awx_workflows:
      - nombre: "USUARIOS | WF - Cambio de contraseña"
        descripcion: Aprobación -> cambio de contraseña -> auditoría de verificación.
        plantilla: "USUARIOS | 2 - Cambiar contraseña"
        encuesta: wf_cambio_contrasena_aprobacion.json
      - nombre: "USUARIOS | WF - Crear usuarios"
        descripcion: Aprobación -> creación de usuarios -> auditoría de verificación.
        plantilla: "USUARIOS | 1 - Crear usuarios"
        encuesta: wf_crear_usuarios_aprobacion.json
      - nombre: "USUARIOS | WF - Bloquear o eliminar"
        descripcion: Aprobación -> bloqueo, reactivación o eliminación -> auditoría de verificación.
        plantilla: "USUARIOS | 4 - Bloquear o eliminar"
        encuesta: wf_bloquear_eliminar_aprobacion.json

  tasks:
    - name: Validar parámetros
      ansible.builtin.assert:
        that: awx_ruta_local | length > 0
        fail_msg: "Indique awx_ruta_local (-e awx_ruta_local=...)."

    - name: Proyecto Manual
      awx.awx.project:
        name: "{{ awx_proyecto }}"
        organization: "{{ awx_organizacion }}"
        scm_type: manual
        local_path: "{{ awx_ruta_local }}"
        default_environment: "{{ awx_ee }}"
        state: present

    - name: Plantillas de trabajo con encuesta
      awx.awx.job_template:
        name: "{{ item.nombre }}"
        organization: "{{ awx_organizacion }}"
        job_type: run
        project: "{{ awx_proyecto }}"
        playbook: "{{ item.playbook }}"
        inventory: "{{ awx_inventario }}"
        credentials: ["{{ awx_credencial_maquina }}"]
        execution_environment: "{{ awx_ee }}"
        instance_groups: "{{ [awx_grupo_persistente] if item.persistente | default(false) else [] }}"
        become_enabled: true
        survey_enabled: true
        survey_spec: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/encuestas/' ~ item.encuesta) | from_json }}"
        allow_simultaneous: false
        state: present
      loop: "{{ awx_plantillas }}"
      loop_control:
        label: "{{ item.nombre }}"

    # Nodos:  [Aprobación] --aprobado--> [Plantilla] --éxito--> [3 - Auditoría]
    # Si se rechaza o vence el plazo, el workflow termina sin ejecutar cambios.
    - name: Workflows con aprobación
      awx.awx.workflow_job_template:
        name: "{{ item.nombre }}"
        description: "{{ item.descripcion }}"
        organization: "{{ awx_organizacion }}"
        allow_simultaneous: false
        survey_enabled: true
        survey_spec: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/encuestas/' ~ item.encuesta) | from_json }}"
        destroy_current_nodes: true
        workflow_nodes:
          - identifier: aprobacion
            unified_job_template:
              name: Aprobacion
              description: "Revise el ticket, el objetivo y los usuarios antes de aprobar."
              type: workflow_approval
              timeout: "{{ awx_aprobacion_timeout | int }}"
            related:
              success_nodes:
                - identifier: cambio
          - identifier: cambio
            unified_job_template:
              name: "{{ item.plantilla }}"
              type: job_template
              organization:
                name: "{{ awx_organizacion }}"
            related:
              success_nodes:
                - identifier: verificacion
          - identifier: verificacion
            unified_job_template:
              name: "USUARIOS | 3 - Auditoría"
              type: job_template
              organization:
                name: "{{ awx_organizacion }}"
        state: present
      loop: "{{ awx_workflows }}"
      loop_control:
        label: "{{ item.nombre }}"

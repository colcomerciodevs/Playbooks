---
# =============================================================================
# OPCIÓN 2 - CAMBIAR CONTRASEÑA O FORZAR SU CAMBIO
#
# AWX: dos plantillas usan este playbook; cada una fija la acción en sus variables:
#   "USUARIOS | 2a - Cambiar contraseña"            contrasena_accion=cambiar
#                                                    (awx/encuestas/02a_cambiar_contrasena.json)
#   "USUARIOS | 2b - Forzar cambio de contraseña"   contrasena_accion=solo_forzar_cambio
#                                                    (awx/encuestas/02b_forzar_cambio.json; admite catálogo
#                                                    o todas las cuentas UID >= 1000)
#
# CLI (la clave va en un archivo cifrado con ansible-vault, no en el historial):
#   ansible-playbook -i inventario/hosts.ini 02_cambiar_contrasena.yml \
#     -e objetivo=PPU_GEOPOS -e contrasena_usuarios=jperez \
#     -e @/ruta/segura/clave.yml          # define contrasena_nueva y contrasena_confirmacion
# =============================================================================

- name: "Opción 2 | Validar encuesta"
  hosts: localhost
  connection: local
  become: false   # en el contenedor no hay sudo; la plantilla activa become para todo
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Validar entradas
      ansible.builtin.include_role:
        name: usuarios_contrasena
        tasks_from: preparar.yml

- name: "Opción 2 | Cambiar contraseña en los servidores"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - vars/comunes.yml
  pre_tasks:
    # Lista completa ANTES de conectarse: el informe incluye también los que no respondan.
    - name: Registrar servidores para el informe
      ansible.builtin.set_fact:
        informe_hosts: "{{ ansible_play_hosts_all }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
  roles:
    - usuarios_contrasena

- name: "Opción 2 | Informe del cambio"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Generar informe en Excel
      ansible.builtin.include_role:
        name: usuarios_comun
        tasks_from: informe.yml
      vars:
        _forzar: "{{ _cp_accion == 'solo_forzar_cambio' }}"
        informe_operacion: "{{ 'Forzar cambio de contraseña' if _forzar | bool else 'Cambiar contraseña' }}"
        informe_prefijo: "{{ 'forzar_cambio_contrasena' if _forzar | bool else 'cambio_contrasena' }}"
        informe_solicitud: "{{ _cp_solicitud }}"
        informe_que_sigue: >-
          {{ ['Avise a cada usuario de la hoja «Por usuario» con resultado APLICADO o PARCIAL: en su próximo ingreso el sistema le pedirá la contraseña actual y luego una nueva.',
              'Las cuentas OMITIDA no se tocaron a propósito (servicio, sin contraseña, expiradas...). Si alguna debía cambiar, use la opción 2a sobre ella.',
              'Revise primero las filas REVISAR y los servidores que fallaron o no respondieron.']
             if _forzar | bool else
             ['Entregue la contraseña nueva a cada usuario por un canal seguro.',
              'Revise primero las filas REVISAR y los servidores que fallaron o no respondieron.'] }}

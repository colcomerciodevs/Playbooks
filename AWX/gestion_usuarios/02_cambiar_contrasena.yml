---
# =============================================================================
# OPCIÓN 2 - CAMBIAR CONTRASEÑA O FORZAR SU CAMBIO
#
# AWX: dos plantillas usan este playbook; cada una fija la acción en sus variables:
#   "USUARIOS | 2a - Cambiar contraseña"            contrasena_accion=cambiar
#                                                    (awx/encuestas/02a_cambiar_contrasena.json)
#   "USUARIOS | 2b - Forzar cambio de contraseña"   contrasena_accion=solo_forzar_cambio
#                                                    (awx/encuestas/02b_forzar_cambio.json; admite catálogo
#                                                    o todas las cuentas UID >= 1000)
#
# CLI (la clave va en un archivo cifrado con ansible-vault, no en el historial):
#   ansible-playbook -i inventario/hosts.ini 02_cambiar_contrasena.yml \
#     -e objetivo=PPU_GEOPOS -e contrasena_usuarios=jperez \
#     -e @/ruta/segura/clave.yml          # define contrasena_nueva y contrasena_confirmacion
# =============================================================================

- name: "Opción 2 | Validar encuesta"
  hosts: localhost
  connection: local
  become: false   # en el contenedor no hay sudo; la plantilla activa become para todo
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Validar entradas
      ansible.builtin.include_role:
        name: usuarios_contrasena
        tasks_from: preparar.yml

- name: "Opción 2 | Cambiar contraseña en los servidores"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - vars/comunes.yml
  roles:
    - usuarios_contrasena

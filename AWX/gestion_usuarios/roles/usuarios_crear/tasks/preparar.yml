---
# =============================================================================
# Se ejecuta en localhost ANTES de tocar servidores y sin escribir nada:
#   1. Valida el objetivo y las respuestas de la encuesta.
#   2. Construye la lista de usuarios (encuesta o catálogo).
#   3. Comprueba que el almacén de llaves esté disponible.
#   4. Deja la lista en 'crear_usuarios_normalizados' (hostvars['localhost']).
# Las llaves se generan después, en llaves.yml, cuando todo ya fue validado.
# =============================================================================

- name: Preparar | Validar objetivo
  ansible.builtin.include_role:
    name: usuarios_comun
    tasks_from: validar_objetivo.yml

- name: Preparar | Normalizar opciones de la encuesta
  ansible.builtin.set_fact:
    _crear_metodo: "{{ crear_metodo_acceso | string | lower | trim }}"
    _crear_origen: "{{ crear_origen | string | lower | trim }}"
    _crear_renovar: "{{ (crear_renovar_llave | string | lower | trim) in valores_si }}"
    _crear_sudo_global: "{{ crear_sudo_nivel | string | lower | trim }}"
    _crear_base: []
    crear_usuarios_normalizados: []
    # Comandos sudo: uno por línea. Si alguien los separó por comas, ", /" también se acepta.
    _crear_sudo_comandos_globales: >-
      {{ (crear_sudo_comandos | default('') | string | regex_replace(',\s*/', '\n/')).splitlines()
         | map('trim') | reject('equalto', '') | list }}
    _crear_grupos_sec_globales: >-
      {{ (crear_grupos_secundarios | default('') | string).split(',')
         | map('trim') | reject('equalto', '') | list }}

- name: Preparar | Validar opciones generales
  ansible.builtin.assert:
    quiet: true
    that:
      - _crear_metodo in ['contrasena', 'llave']
      - _crear_origen in ['encuesta', 'catalogo']
      - _crear_sudo_global in ['ninguno', 'completo', 'limitado']
      - not (_crear_renovar | bool) or _crear_metodo == 'llave'
    fail_msg: >-
      Opciones inválidas. Revise: método = contrasena|llave; origen = encuesta|catalogo;
      sudo = ninguno|completo|limitado. "Renovar llave" solo aplica con método llave.

# ---------------------------------------------------------------------------
# Construcción de la lista base
# ---------------------------------------------------------------------------
- name: Preparar | Leer usuarios desde la encuesta (usuario;nombre;grupo)
  ansible.builtin.set_fact:
    _crear_base: "{{ _crear_base + [_registro] }}"
  loop: >-
    {{ (crear_usuarios_texto | default('') | string).splitlines()
       | map('trim') | reject('equalto', '') | reject('match', '#') | list }}
  loop_control:
    label: "{{ item }}"
  vars:
    _campos: "{{ item.split(';') | map('trim') | list }}"
    _registro:
      usuario: "{{ _campos[0] | lower }}"
      nombre: "{{ _campos[1] | default('') }}"
      grupo: "{{ _campos[2] | default('') }}"
  when: _crear_origen == 'encuesta'

- name: Preparar | Validar que exista el catálogo
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/vars/catalogos/{{ crear_catalogo }}.yml"
  register: _crear_catalogo_stat
  when: _crear_origen == 'catalogo'

- name: Preparar | Fallar si el catálogo no existe
  ansible.builtin.fail:
    msg: "No existe vars/catalogos/{{ crear_catalogo }}.yml en el proyecto."
  when:
    - _crear_origen == 'catalogo'
    - not _crear_catalogo_stat.stat.exists

- name: Preparar | Cargar catálogo
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars/catalogos/{{ crear_catalogo }}.yml"
    name: _crear_catalogo_datos
  when: _crear_origen == 'catalogo'

- name: Preparar | Leer usuarios desde el catálogo
  ansible.builtin.set_fact:
    _crear_base: >-
      {{ _crear_base + [ (_crear_catalogo_datos.catalogo_defaults | default({}))
                         | combine(item)
                         | combine({'usuario': (item.usuario | default(item.name | default(''))) | string | lower | trim,
                                    'nombre': item.nombre | default(item.comment | default(''))}) ] }}
  loop: "{{ (_crear_catalogo_datos | default({})).usuarios | default([]) }}"
  loop_control:
    label: "{{ item.usuario | default(item.name | default('?')) }}"
  when: _crear_origen == 'catalogo'

- name: Preparar | Debe haber al menos un usuario
  ansible.builtin.assert:
    quiet: true
    that: _crear_base | length > 0
    fail_msg: >-
      No se recibió ningún usuario. En la encuesta escriba una línea por usuario con el formato
      usuario;Nombre completo;grupo(opcional), o elija un catálogo con usuarios.

# ---------------------------------------------------------------------------
# Normalización: un diccionario homogéneo por usuario
# Precedencia: campo del usuario en catálogo > catalogo_defaults > encuesta > defaults del rol
# ---------------------------------------------------------------------------
- name: Preparar | Normalizar definición de cada usuario
  ansible.builtin.set_fact:
    crear_usuarios_normalizados: "{{ crear_usuarios_normalizados + [_u] }}"
  loop: "{{ _crear_base }}"
  loop_control:
    label: "{{ item.usuario }}"
  vars:
    _sudo: "{{ item.sudo | default(_crear_sudo_global, true) | string | lower | trim }}"
    _llave: >-
      {%- if item.llave_publica | default('') | length > 0 -%}
      {{ item.llave_publica }}
      {%- endif -%}
    _nopasswd_pedido: "{{ (item.sudo_nopasswd | default(crear_sudo_nopasswd)) | string | lower | trim in valores_si }}"
    _u:
      usuario: "{{ item.usuario }}"
      nombre: "{{ item.nombre | default('', true) | default(item.usuario, true) }}"
      grupo: "{{ item.grupo | default(crear_grupo_primario, true) | default(item.usuario, true) | string | trim }}"
      grupos: "{{ item.grupos | default(_crear_grupos_sec_globales, true) }}"
      uid: "{{ item.uid | default('') | string }}"
      shell: "{{ item.shell | default(crear_shell, true) }}"
      shell_solaris: "{{ item.shell_solaris | default(crear_shell_solaris, true) }}"
      home: "{{ item.home | default(crear_home_base ~ '/' ~ item.usuario, true) }}"
      llave_publica: "{{ _llave | trim }}"
      # Llave que se retira de los servidores cuando hay renovación (la completa llaves.yml).
      llave_anterior: ""
      sudo: "{{ _sudo }}"
      # Con método llave la cuenta no tiene contraseña: sudo con clave sería inutilizable.
      sudo_nopasswd: "{{ (_nopasswd_pedido | bool) or (_crear_metodo == 'llave' and _sudo != 'ninguno') }}"
      sudo_comandos: "{{ item.sudo_comandos | default(_crear_sudo_comandos_globales, true) }}"
      sudo_archivo: "{{ item.usuario | regex_replace('[.~]', '_') }}"

# ---------------------------------------------------------------------------
# Validaciones
# ---------------------------------------------------------------------------
- name: Preparar | Validar cada usuario
  ansible.builtin.assert:
    quiet: true
    that:
      - item.usuario is match(regex_nombre_usuario)
      - item.usuario not in usuarios_protegidos
      - item.nombre is not search('[:\n]')
      - item.grupo is match(regex_nombre_usuario)
      - item.grupo not in grupos_prohibidos
      - item.grupos | reject('match', regex_nombre_usuario) | list | length == 0
      - item.grupos | select('in', grupos_prohibidos) | list | length == 0
      - item.uid == '' or (item.uid is match('^[0-9]+$') and (item.uid | int) >= (uid_minimo_humano | int))
      - item.sudo in ['ninguno', 'completo', 'limitado']
      - item.sudo != 'limitado' or (item.sudo_comandos | length > 0)
      - item.sudo_comandos | reject('match', '^(/|sudoedit )') | list | length == 0
      - item.llave_publica == '' or (item.llave_publica is match(regex_llave_publica))
    fail_msg: >-
      Usuario '{{ item.usuario }}' inválido. Verifique: nombre en minúsculas (máx. 32), que no sea
      una cuenta protegida ({{ usuarios_protegidos | join(', ') }}), nombre completo sin ':', grupo válido y
      no privilegiado ({{ grupos_prohibidos | join(', ') }}), UID >= {{ uid_minimo_humano }},
      sudo limitado con al menos un comando, comandos sudo con ruta absoluta y llave pública válida.
  loop: "{{ crear_usuarios_normalizados }}"
  loop_control:
    label: "{{ item.usuario }}"

- name: Preparar | Validar que no haya usuarios repetidos
  ansible.builtin.assert:
    quiet: true
    that: >-
      crear_usuarios_normalizados | map(attribute='usuario') | unique | list | length
      == crear_usuarios_normalizados | length
    fail_msg: "Hay usuarios repetidos en la lista."

- name: Preparar | Validar contraseña inicial
  ansible.builtin.assert:
    quiet: true
    that:
      - crear_contrasena_inicial | string | length >= (contrasena_longitud_minima | int)
      - "'\n' not in (crear_contrasena_inicial | string)"
    fail_msg: >-
      Con el método 'contrasena' la contraseña inicial es obligatoria
      (mínimo {{ contrasena_longitud_minima }} caracteres, sin saltos de línea).
  no_log: true
  when: _crear_metodo == 'contrasena'

- name: Preparar | Consultar almacén de llaves
  ansible.builtin.stat:
    path: "{{ crear_llaves_dir }}"
  register: _crear_almacen
  when: _crear_metodo == 'llave'

- name: Preparar | Exigir almacén de llaves disponible
  ansible.builtin.assert:
    quiet: true
    that:
      - _crear_almacen.stat.isdir | default(false)
      - _crear_almacen.stat.writeable | default(false)
    fail_msg: >-
      No se puede escribir en {{ crear_llaves_dir }}: las llaves nuevas se perderían. Verifique que la carpeta
      exista, que el job tenga permiso de escritura y que la plantilla tenga el grupo de instancias
      Container_Group_Corbeta. No se modificó ningún servidor.
  when: _crear_metodo == 'llave'

- name: Preparar | Resumen de lo que se va a crear
  ansible.builtin.debug:
    msg: >-
      {{ item.usuario }} ({{ item.nombre }}) | grupo={{ item.grupo }}
      | acceso={{ _crear_metodo }} | sudo={{ item.sudo }}{{ ' NOPASSWD' if (item.sudo_nopasswd | bool) else '' }}
      {{- (' [' ~ (item.sudo_comandos | join(', ')) ~ ']') if item.sudo == 'limitado' else '' }}
  loop: "{{ crear_usuarios_normalizados }}"
  loop_control:
    label: "{{ item.usuario }}"

---
# Comprobaciones (solo lectura): si fallan en un servidor, se detienen todos antes de cambiar nada.
- name: Eliminar | Comprobaciones previas en los servidores
  any_errors_fatal: true
  block:
    - name: Eliminar | Consultar cuentas
      ansible.builtin.getent:
        database: passwd

    # Solo cuentas existentes y con UID >= uid_minimo_humano (nunca cuentas de servicio).
    - name: Eliminar | Definir cuentas a procesar
      ansible.builtin.set_fact:
        _el_accion: "{{ hostvars['localhost']['_el_accion'] }}"
        _el_existentes: "{{ hostvars['localhost']['eliminar_lista'] | select('in', ansible_facts.getent_passwd.keys() | list) | list }}"
        _el_omitidas: []

    - name: Eliminar | Detectar cuentas de servicio
      ansible.builtin.set_fact:
        _el_omitidas: "{{ _el_omitidas + [item] }}"
      loop: "{{ _el_existentes }}"
      when: (ansible_facts.getent_passwd[item][1] | int) < (uid_minimo_humano | int)

    - name: Eliminar | Lista final
      ansible.builtin.set_fact:
        _el_aplicar: "{{ _el_existentes | reject('in', _el_omitidas) | list }}"

    # userdel -r borraría el home sin respaldo si está fuera de las rutas conocidas.
    - name: Eliminar | Exigir home en ruta conocida
      ansible.builtin.assert:
        quiet: true
        that: ansible_facts.getent_passwd[item][4] is match('^/(home|export/home)/[^/]+/?$')
        fail_msg: >-
          El home de {{ item }} en {{ inventory_hostname }} es {{ ansible_facts.getent_passwd[item][4] }}, fuera de
          /home o /export/home. No se elimina de forma automática. No se modificó ningún servidor.
      loop: "{{ _el_aplicar }}"
      when: _el_accion == 'eliminar'

- name: Eliminar | Cuentas omitidas o inexistentes
  ansible.builtin.debug:
    msg:
      - "No existen: {{ hostvars['localhost']['eliminar_lista'] | reject('in', ansible_facts.getent_passwd.keys() | list) | join(', ') or '-' }}"
      - "Omitidas por UID < {{ uid_minimo_humano }}: {{ _el_omitidas | join(', ') or '-' }}"

- name: Eliminar | Retirar reglas sudo del usuario
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item | regex_replace('[.~]', '_') }}"
    state: absent
  loop: "{{ _el_aplicar }}"
  when: _el_accion != 'reactivar'

# --- BLOQUEAR ----------------------------------------------------------------
- name: Eliminar | Bloquear contraseña y expirar cuenta (Linux)
  ansible.builtin.command:
    argv: [usermod, -L, -e, '1970-01-02', "{{ item }}"]
  loop: "{{ _el_aplicar }}"
  changed_when: true
  when:
    - _el_accion == 'bloquear'
    - ansible_system == 'Linux'

- name: Eliminar | Bloquear cuenta (Solaris 11)
  ansible.builtin.command:
    argv: [passwd, -l, "{{ item }}"]
  loop: "{{ _el_aplicar }}"
  changed_when: true
  when:
    - _el_accion == 'bloquear'
    - ansible_system == 'SunOS'

# --- REACTIVAR ---------------------------------------------------------------
# Reinicia intentos fallidos y quita la expiración (también lee /etc/shadow).
- name: Eliminar | Reactivar cuentas
  ansible.builtin.include_role:
    name: usuarios_comun
    tasks_from: desbloquear.yml
  vars:
    comun_usuarios: "{{ _el_aplicar }}"
  when:
    - _el_accion == 'reactivar'
    - _el_aplicar | length > 0

# Solo si hay una contraseña real bloqueada ("!$6$..."); las cuentas de solo llave siguen sin contraseña.
- name: Eliminar | Desbloquear contraseña (Linux)
  ansible.builtin.command:
    argv: [usermod, -U, "{{ item }}"]
  loop: "{{ _el_aplicar }}"
  changed_when: true
  when:
    - _el_accion == 'reactivar'
    - ansible_system == 'Linux'
    - (ansible_facts.getent_shadow[item] | default(['']))[0] is match('^!+[$]')

# --- ELIMINAR ----------------------------------------------------------------
- name: Eliminar | Respaldar home antes de borrar
  when:
    - _el_accion == 'eliminar'
    - (eliminar_respaldar_home | string | lower | trim) in valores_si
    - _el_aplicar | length > 0
  block:
    - name: Eliminar | Carpeta de respaldo
      ansible.builtin.file:
        path: "{{ eliminar_dir_respaldo }}"
        state: directory
        mode: "0700"

    - name: Eliminar | Comprimir home
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ eliminar_dir_respaldo }}/{{ item }}_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
          - -C
          - "{{ ansible_facts.getent_passwd[item][4] | dirname }}"
          - "{{ ansible_facts.getent_passwd[item][4] | basename }}"
      loop: "{{ _el_aplicar }}"
      changed_when: true
      when: ansible_facts.getent_passwd[item][4] is match('^/(home|export/home)/')

- name: Eliminar | Borrar cuenta y home
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ _el_aplicar }}"
  when: _el_accion == 'eliminar'

- name: Eliminar | Resumen
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ {'bloquear': 'bloqueadas', 'reactivar': 'reactivadas', 'eliminar': 'eliminadas'}[_el_accion] }} -> {{ _el_aplicar | join(', ') or '-' }}"

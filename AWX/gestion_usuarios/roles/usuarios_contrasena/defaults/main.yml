---
# =============================================================================
# OPCIÓN 2 - CAMBIAR CONTRASEÑA
# =============================================================================

# Uno o varios usuarios, separados por coma, espacio o salto de línea.
contrasena_usuarios: root

# Llegan desde la encuesta (campos tipo contraseña: AWX los cifra y no los muestra).
contrasena_nueva: ""
contrasena_confirmacion: ""

# SI = la contraseña queda sin caducidad (chage -m 0 -M 99999 -I -1).
#      Necesario en cuentas críticas como root cuando el hardening fuerza caducidad.
# NO = se conserva la política de caducidad que ya tenga la cuenta.
contrasena_nunca_caduca: "SI"

# SI = además elimina la fecha de expiración de la CUENTA (chage -E -1).
#      Úselo si la cuenta tiene fecha de vencimiento y debe quedar permanente.
contrasena_quitar_expiracion_cuenta: "NO"

# SI = obliga al usuario a cambiar la clave en su próximo inicio de sesión.
#      Incompatible con "nunca caduca" y prohibido para root y cuentas protegidas.
contrasena_forzar_cambio: "NO"

# SI = reinicia intentos fallidos (faillock / pam_tally2) y quita expiración vencida.
contrasena_desbloquear: "SI"

# Las cuentas con UID entre 1 y 999 son de servicio. Por seguridad no se les
# cambia la clave salvo que se habilite explícitamente. root (UID 0) sí se permite.
contrasena_permitir_cuentas_servicio: "NO"

# Si un usuario no existe en un servidor: SI = avisar y continuar, NO = marcar el servidor como fallido.
contrasena_omitir_inexistentes: "SI"

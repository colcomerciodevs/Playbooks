---
# =============================================================================
# OPCIÓN 3 - Consolidado en localhost: un Excel (.xlsx), resumen en el job y
# estadísticas para AWX. Los archivos quedan en auditoria_dir_salida.
# =============================================================================

- name: Reporte | Determinar servidores y archivos
  ansible.builtin.set_fact:
    aud_hosts: "{{ hostvars['localhost']['auditoria_hosts_objetivo'] | default([]) }}"
    aud_fecha: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }}"
    aud_sello: "{{ now(fmt='%Y%m%d_%H%M%S') }}"
    # IP de cada servidor (ansible_host del inventario; si no tiene, el mismo nombre).
    aud_ip: >-
      {% set r = {} %}{% for h in hostvars['localhost']['auditoria_hosts_objetivo'] | default([]) %}
      {%- set _ = r.update({h: hostvars[h]['ansible_host'] | default(h)}) %}{% endfor %}{{ r }}

# En un workflow (llega cambio_cuentas) el informe es la verificación del cambio realizado.
- name: Reporte | Ruta del Excel
  ansible.builtin.set_fact:
    aud_cambio: "{{ cambio_cuentas is defined }}"
    aud_xlsx: "{{ auditoria_dir_salida }}/{{ 'verificacion_cambio' if cambio_cuentas is defined else 'auditoria_usuarios' }}_{{ aud_sello }}.xlsx"

- name: Reporte | Crear carpeta de reportes
  ansible.builtin.file:
    path: "{{ auditoria_dir_salida }}"
    state: directory
    mode: "0750"

# Un solo archivo: Resumen, Usuarios, Hallazgos, Sudo, Detalle, Servidores (y No encontradas en un workflow).
- name: Reporte | Generar Excel
  generar_excel:
    destino: "{{ aud_xlsx }}"
    hojas: "{{ _hojas if _hojas is not string else _hojas | from_json }}"
  vars:
    # Ansible 2.9 ya entrega el JSON convertido en lista; las versiones nuevas, como texto.
    _hojas: "{{ lookup('ansible.builtin.template', 'reporte_excel.json.j2') }}"

- name: Reporte | Resumen consolidado
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'resumen_consola.j2').splitlines() }}"

# Visible en AWX: Detalles del job -> Artefactos. Útil para encadenar en un Workflow.
- name: Reporte | Publicar estadísticas para AWX
  ansible.builtin.set_stats:
    data:
      auditoria_usuarios:
        fecha: "{{ aud_fecha }}"
        servidores: "{{ dict(aud_hosts | zip(aud_hosts | map('extract', hostvars) | map(attribute='auditoria_resultado.resumen', default={'estado': 'SIN_DATOS'}))) }}"
    per_host: false
    aggregate: false

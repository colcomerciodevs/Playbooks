---
# =============================================================================
# OPCIÓN 4 - BLOQUEAR, REACTIVAR O ELIMINAR USUARIOS
# Protecciones: no toca cuentas protegidas (vars/comunes.yml) ni UID < 1000.
#
# AWX: plantilla "USUARIOS | 4 - Bloquear o eliminar" con awx/encuestas/04_bloquear_eliminar_usuarios.json
# =============================================================================

- name: "Opción 4 | Validar encuesta"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/comunes.yml
  tasks:
    - name: Validar entradas
      ansible.builtin.include_role:
        name: usuarios_eliminar
        tasks_from: preparar.yml

- name: "Opción 4 | Aplicar en los servidores"
  hosts: "{{ objetivo | default('NINGUN_SERVIDOR_SELECCIONADO') }}"
  become: true
  gather_facts: true
  gather_subset: [min]
  vars_files:
    - vars/comunes.yml
  roles:
    - usuarios_eliminar

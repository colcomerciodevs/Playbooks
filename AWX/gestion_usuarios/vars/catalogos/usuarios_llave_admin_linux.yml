# Catálogo: administradores Linux con acceso por llave (migrado de 'con_LLave/vars/vars_usuarios_BK.yml').
# Uso recomendado: Método = llave, Origen de la llave = keys
#   (se reutiliza la llave de keys/<usuario>; si no existe se genera y se guarda en keys/).
usuarios:
  - usuario: jcantor
    nombre: "Usuario administrador de Linux - Amaris"
    sudo: completo
    sudo_nopasswd: true

  - usuario: cchaves
    nombre: "Usuario administrador de Linux - Amaris"
    sudo: completo
    sudo_nopasswd: true

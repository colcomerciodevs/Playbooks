---
# Catálogo: personal de QA (Entelgy, Geocom, Keyrus, SQA, Choucair...).
# Uso: encuesta de la opción 1a -> Origen = catalogo, Catálogo = soporte_qa
# Perfil perfil_qa (vars/perfiles.yml): sudo completo para el grupo soporte, sin su ni shells
# de root. Solo con contraseña (1a): la contraseña inicial se escribe en la encuesta.
# Los valores de 'catalogo_defaults' aplican a todos los usuarios del archivo;
# cualquier campo definido en un usuario los reemplaza.
catalogo_defaults:
  grupo: soporte
  perfil: perfil_qa

usuarios:

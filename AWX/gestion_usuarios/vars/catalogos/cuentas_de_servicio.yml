---
# Catálogo: cuentas de servicio (aplicaciones, integraciones, plataformas).
# El método de acceso (llave o contraseña) se elige en la encuesta. El sudo se define
# por cuenta con los campos de abajo: ninguno, limitado (con sus comandos) o completo.
# Agregue también estas cuentas a 'cuentas_servicio' en vars/comunes.yml para que
# queden fuera del forzado de contraseña en bloque de la opción 2.
usuarios:
  - usuario: srvinnops
    nombre: "Plataforma de IA Infraestructura Corbeta"
    shell_solaris: /usr/bin/bash
    sudo: ninguno

# -----------------------------------------------------------------------------
# REFERENCIA DE CAMPOS (todos opcionales salvo 'usuario'):
#   usuario        nombre de la cuenta
#   nombre         nombre completo / descripción (GECOS)
#   grupo          grupo primario (si se omite: grupo con el nombre del usuario)
#   grupos         lista de grupos secundarios (solo se agregan si existen)
#   uid            UID fijo (>= 1000)
#   shell          shell en Linux            (por defecto /bin/bash)
#   shell_solaris  shell en Solaris 11       (por defecto /usr/bin/bash)
#   home           directorio home           (por defecto /home/<usuario>)
#   llave_publica  llave pública SSH en línea (tiene prioridad sobre el almacén de llaves)
#   sudo           ninguno | completo | limitado
#   sudo_nopasswd  true | false
#   sudo_comandos  lista de comandos con ruta absoluta (para sudo: limitado)
#
# Ejemplo de sudo limitado:
#  - usuario: jmonitor
#    nombre: "Usuario de monitoreo"
#    sudo: limitado
#    sudo_nopasswd: true
#    sudo_comandos:
#      - /usr/bin/systemctl status *
#      - /usr/bin/journalctl -u nginx
# -----------------------------------------------------------------------------

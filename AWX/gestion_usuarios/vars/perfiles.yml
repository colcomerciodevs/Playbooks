---
# =============================================================================
# PERFILES DE CUENTA (opciones 1a y 1b)
# Cada usuario recibe un perfil: en la encuesta ("Perfil de la cuenta") o en el
# catálogo (campo 'perfil', que manda sobre la encuesta).
# El perfil se aplica como /etc/sudoers.d/<usuario>, validado con visudo.
#
# Campos:
#   descripcion    texto que se muestra en el job y en el encabezado de la regla
#   sudo           ninguno | completo | limitado
#   sudo_nopasswd  true = sudo no pide contraseña. Con el método llave siempre es true
#                  (la cuenta no tiene contraseña y sudo sería inutilizable).
#   comandos       (limitado) un comando por línea. La primera palabra es el programa,
#                  sin ruta: se busca en cada servidor en crear_sudo_rutas_busqueda.
#                  Si no existe en un servidor, se omite con aviso. Un comando sin
#                  argumentos no admite argumentos (la regla lleva "").
#   servicios      (opcional) programas que se combinan con 'acciones':
#   acciones         servicio + acción  ->  "geopos status", "geopos restart"...
#   prohibidos     (completo, opcional) programas que NO puede ejecutar con sudo, sin ruta.
#                  Se buscan en cada servidor (todas las rutas de crear_sudo_rutas_busqueda)
#                  y la regla queda "ALL, !/ruta/programa, ...". Evita el uso casual de
#                  sudo -i, sudo -s o sudo su -, pero NO es una barrera de seguridad: con
#                  sudo completo hay otras formas de llegar a root (editores, intérpretes,
#                  copiar binarios...). Úselo solo donde eso sea aceptable (p. ej. QA).
#   comandos_libres (limitado, opcional) programas sin ruta que admiten CUALQUIER argumento.
#                  Se permiten en todas las rutas donde existan en el servidor.
#   defaults       (opcional) opciones de sudo solo para esta cuenta, p. ej. timestamp_timeout=10,
#                  !requiretty. Se escriben como "Defaults:<usuario> ...".
#   solo_contrasena (opcional) true = el perfil no se puede usar con el método llave (1b).
#   grupo_sudo     (completo, opcional) la regla se da al GRUPO (%grupo, archivo
#                  /etc/sudoers.d/grupo_<grupo>) y no a cada usuario. El grupo se crea si no
#                  existe y el usuario se agrega a él. ⚠ TODO miembro del grupo en ese servidor
#                  recibe el sudo del perfil, también los que ya estaban.
#                  sudo_nopasswd es el del perfil (no depende del método): con
#                  sudo_nopasswd false el perfil solo se puede usar con contraseña (1a).
#
# NO agregue editores, paginadores ni shells (vi, less, more, man, bash, su...) ni
# comodines (*): permiten llegar a root o tocar archivos no previstos. Excepciones:
# perfil_integracion_oim, que Oracle exige así para el conector UNIX de OIM (equivale a root), y
# perfil_soporte_geopos, que solo admite sh con dos scripts fijos (argumentos exactos).
# Para cambiar un perfil: edite este archivo y ejecute la opción 1 con
# "Actualizar usuarios que ya existen = SI" sobre las cuentas que lo tienen.
# =============================================================================
perfil_por_defecto: perfil_estandar

perfiles:
  perfil_admin_linux:
    descripcion: "Administrador global Linux: sudo completo"
    sudo: completo
    sudo_nopasswd: false

  perfil_qa:
    descripcion: "QA: sudo completo vía grupo soporte, sin su ni shells de root (sudo -i, sudo -s, sudo su -)"
    sudo: completo
    sudo_nopasswd: false
    grupo_sudo: soporte
    prohibidos: [su, sudo, bash, sh, dash, ksh, zsh, csh, tcsh, visudo, passwd]

  # Cuenta de servicio del conector UNIX/Linux de Oracle Identity Manager (reemplaza a root).
  # Comandos y opciones según la documentación de Oracle (sección 2.1.2.5). Equivale a root:
  # con sh, awk, sed, rm o passwd puede hacer cualquier cosa; queda registrado en el log de sudo.
  perfil_integracion_oim:
    descripcion: "Integración OIM (conector UNIX): administración de cuentas. Equivale a root"
    sudo: limitado
    sudo_nopasswd: false
    solo_contrasena: true
    defaults: [timestamp_timeout=10, "!requiretty"]
    comandos_libres: [usermod, useradd, userdel, passwd, chage, id, cut, touch, awk, uniq,
                      sed, cat, diff, sort, rm, grep, egrep, echo, sh]

  perfil_auditor_linux:
    descripcion: "Auditor Linux: solo comandos de consulta"
    sudo: limitado
    sudo_nopasswd: false
    comandos:
      - last
      - lastb
      - lastlog
      - journalctl --no-pager -n 500
      - systemctl --no-pager status
      - ss -tulpn
      - ps aux
      - cat /etc/sudoers
      - ls -l /etc/sudoers.d

  # Solo lo listado: sudo -i, sudo -s, sudo su -, sudo bash, editores y paginadores quedan negados
  # porque no están en la lista. Los comandos_libres son de consulta y no abren shells; ojo: cat,
  # tail, grep... con sudo pueden leer cualquier archivo (también /etc/shadow).
  # sh solo con dos scripts fijos: deben ser de root y nadie más debe poder modificarlos
  # (si no, quien los edite obtiene root).
  # Sin sudo ya funcionan: df -h, date, free, uptime, ps, top, ping, systemctl status <servicio>.
  perfil_soporte_geopos:
    descripcion: "Soporte Geopos: servicios Geopos, logs, procesos y red, sin escalar a root"
    sudo: limitado
    sudo_nopasswd: false
    comandos_libres: [tail, head, grep, egrep, zgrep, zcat, cat, wc, ls, du, lsof, ss, netstat, kill]
    comandos:
      - sh /geopos2/rifa/demonio.sh       # sudo -b sh /geopos2/rifa/demonio.sh (en segundo plano)
      - sh /root/demonio-sonido.sh        # sudo -b sh /root/demonio-sonido.sh
      - tee -a /dev/ttyUSB0               # sudo tee -a /dev/ttyUSB0 < /geopos2/rifa/caja_geo > /dev/null
    servicios:
      - geopos
      - geopromotion
      - tomcat6-consola
      - tomcat6-conciliacion
      - tomcat6-turnos
      - tomcat6-salida
      - tomcat6-geogames
    acciones: [status, start, stop, restart]

  perfil_estandar:
    descripcion: "Cuenta estándar: sin sudo"
    sudo: ninguno

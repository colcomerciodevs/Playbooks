---
# =============================================================================
# Variables comunes a todas las operaciones (se cargan con vars_files).
# =============================================================================

# Respuestas de encuesta que se interpretan como "sí".
valores_si: ['si', 'sí', 's', 'yes', 'y', 'true', '1', 'on']

# UID desde el cual una cuenta se considera de persona (no de servicio).
uid_minimo_humano: 1000

# Cuentas críticas: NUNCA se crean, modifican ni eliminan con las opciones 1 y 4.
# En la opción 2 cambiar su clave exige confirmación y no se permite con objetivo all.
# Incluye las cuentas con las que Ansible/AWX se conecta: si se tocan,
# se pierde el acceso a los servidores.
usuarios_protegidos:
  - root
  - bin
  - daemon
  - adm
  - lp
  - sync
  - shutdown
  - halt
  - mail
  - operator
  - games
  - ftp
  - nobody
  - nfsnobody
  - sshd
  - polkitd
  - systemd-network
  - ansible_test   # cuentas de automatización: solo las gestiona la plantilla 0 (relación de confianza)
  - iacolcoauto
  - adminso
  - tux
  - azureuser
  - awx
  - opc
  - ec2-user
  - cloud-user
  - ubuntu

# Cuentas de servicio con UID >= 1000 (aplicaciones, bases de datos, integraciones).
# Una sola lista para todos los servidores. Se EXCLUYEN de las operaciones en bloque
# de la opción 2 (catálogo o todos UID >= 1000). Identifíquelas con la auditoría:
# columna "Se le forzaría el cambio".
cuentas_servicio:
  - pos        # aplicación POS (GeoPOS)
  - postgres   # PostgreSQL

# Grupos que dan privilegios: no se pueden asignar desde la opción 1.
grupos_prohibidos: [root, wheel, sudo, admin, adm, shadow, disk, kmem, docker, lxd, libvirt]

# Carpeta persistente (volumen del grupo de instancias Container_Group_Corbeta).
gestion_dir_persistente: /data/work/gestion_usuarios

# Formato aceptado para nombres de usuario y grupo.
regex_nombre_usuario: '^[a-z_][a-z0-9_.-]{0,31}$'

# Formato aceptado para llaves públicas SSH.
regex_llave_publica: '^(ssh-(rsa|ed25519|dss)|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+={0,3}( .*)?$'

# Longitud mínima de contraseñas recibidas por encuesta.
contrasena_longitud_minima: 8

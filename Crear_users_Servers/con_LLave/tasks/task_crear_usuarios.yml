---
- name: Crear grupo del usuario
  ansible.builtin.group:
    name: "{{ item.group | default(item.username) }}"
    state: present
  loop: "{{ usuarios }}"

- name: Validar si existe el grupo de acceso SSH en el host
  ansible.builtin.command: "getent group {{ acceso_ssh.grupo | default('ssh_access') }}"
  register: grupo_acceso_ssh
  changed_when: false
  failed_when: false
  check_mode: false          
  when: acceso_ssh.habilitado | default(true) | bool

- name: Registrar si el usuario debe agregarse al grupo de acceso SSH
  ansible.builtin.set_fact:
    agregar_a_grupo_ssh: "{{ (grupo_acceso_ssh.rc | default(1)) == 0 }}"

- name: Informar el resultado de la validación del grupo de acceso SSH
  ansible.builtin.debug:
    msg: >-
      {{ (agregar_a_grupo_ssh | bool)
         | ternary('El grupo ' ~ (acceso_ssh.grupo | default('ssh_access')) ~
                   ' existe: los usuarios se agregarán a él.',
                   'El grupo ' ~ (acceso_ssh.grupo | default('ssh_access')) ~
                   ' no existe en este host: no se realizan cambios de grupo.') }}

- name: Crear usuarios en Linux
  ansible.builtin.user:
    name: "{{ item.username }}"
    group: "{{ item.group | default(item.username) }}"
    comment: "{{ item.comment | default(item.username) }}"
    uid: "{{ item.uid | default(omit) }}"
    shell: "{{ item.shell_linux | default('/bin/bash') }}"
    home: "{{ item.home | default('/home/' ~ item.username) }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: "{{ item.state | default('present') }}"
    password_lock: true
    groups: "{{ [acceso_ssh.grupo | default('ssh_access')] if (agregar_a_grupo_ssh | bool) else omit }}"
    append: true
  loop: "{{ usuarios }}"
  when: ansible_system == "Linux"

- name: Crear usuarios en Solaris 11
  ansible.builtin.user:
    name: "{{ item.username }}"
    group: "{{ item.group | default(item.username) }}"
    comment: "{{ item.comment | default(item.username) }}"
    uid: "{{ item.uid | default(omit) }}"
    shell: "{{ item.shell_solaris | default('/usr/bin/sh') }}"
    home: "{{ item.home | default('/home/' ~ item.username) }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: "{{ item.state | default('present') }}"
    groups: "{{ [acceso_ssh.grupo | default('ssh_access')] if (agregar_a_grupo_ssh | bool) else omit }}"
    append: true
  loop: "{{ usuarios }}"
  when: ansible_system == "SunOS"

- name: Bloquear password en Linux
  ansible.builtin.command: "passwd -l {{ item.username }}"
  loop: "{{ usuarios }}"
  changed_when: false
  failed_when: false
  when:
    - ansible_system == "Linux"
    - item.state | default('present') == 'present'

- name: Bloquear password en Solaris 11
  ansible.builtin.command: "passwd -l {{ item.username }}"
  loop: "{{ usuarios }}"
  changed_when: false
  failed_when: false
  when:
    - ansible_system == "SunOS"
    - item.state | default('present') == 'present'